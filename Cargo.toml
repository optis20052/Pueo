[package]
name = "pueo"
version = "0.1.0"
edition = "2024"

[build-dependencies]
glib-build-tools = "0.22"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_8"] }
anyhow = "1"
async-trait = "0.1"
csv = "1"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
mysql_async = "0.37"
native-tls = "0.2"
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
postgres-native-tls = "0.5"
redis = { version = "1", features = ["tokio-comp", "tokio-native-tls-comp"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sourceview5 = { version = "0.11", features = ["v5_12"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
tokio-postgres = "0.7"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["sourceview"]
# GtkSourceView editor (needs libgtksourceview-5-dev); without it a plain TextView is used.
sourceview = ["dep:sourceview5"]

# Faster debug builds: keep line numbers for backtraces, skip full debug info.
[profile.dev]
debug = "line-tables-only"
